<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Electrace — the electrical engineer's IDE">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;family=Inter:wght@700&amp;display=swap');
      :root{ --ink:#1e2a3a; --accent:#4c8dff; --muted:#5b6b80; --paper:#ffffff; }
      .ring  { fill:none; stroke:var(--ink); stroke-width:20; stroke-linecap:round; }
      .trace { fill:none; stroke:var(--accent); stroke-width:9; stroke-linejoin:round; stroke-linecap:round; }
      .term  { fill:var(--paper); stroke:var(--accent); stroke-width:7; }
      .word  { font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:700; font-size:92px; fill:var(--ink); }
      .caret { fill:var(--accent); }
      .tag   { font-family:'Inter',system-ui,sans-serif; font-weight:700; font-size:17px; letter-spacing:3px; fill:var(--muted); }
      .dash  { stroke:var(--accent); stroke-width:3; stroke-linecap:round; }
    </style>
  </defs>

  <!-- ===== MARK: a "C" (circuit + C-language IDE) with a resistor trace + net terminals ===== -->
  <g id="mark">
    <path class="ring" d="M390.5 90.8 A92 92 0 1 0 390.5 209.2"/>
    <path class="trace" d="M282 150 H322 L329 132 L344 168 L359 132 L374 168 L389 132 L400 150 H433"/>
    <circle class="term" cx="270" cy="150" r="12"/>
    <circle class="term" cx="445" cy="150" r="12"/>
  </g>

  <!-- ===== WORDMARK: monospace (IDE / code heritage) + a code caret ===== -->
  <!-- textLength fixes the width so the caret always lands at the right edge, font or not -->
  <text class="word" x="300" y="362" text-anchor="middle" textLength="466" lengthAdjust="spacing">Electrace</text>
  <rect class="caret" x="546" y="320" width="14" height="54" rx="2"/>

  <!-- ===== TAGLINE (fixed width via textLength so the dashes never overlap) ===== -->
  <line class="dash" x1="96"  y1="420" x2="126" y2="420"/>
  <text class="tag" x="320" y="425" text-anchor="middle" textLength="372" lengthAdjust="spacingAndGlyphs">THE ELECTRICAL ENGINEER'S IDE</text>
  <line class="dash" x1="514" y1="420" x2="544" y2="420"/>
</svg>
