id: "@electrace/buck-converter"
name: Buck Converter
version: 1.2.0
category: power
author: electrace
license: CC-BY-4.0
glyph: "⇄"
topology: switching
transform: { kind: regulator, efficiency: 0.85 }
spec:
  vin: { min: 9, max: 18, unit: V }
  vout: { value: 5.0, unit: V }
  iout_max: { value: 3, unit: A }
  efficiency: { value: 0.85 }
terminals:
  - { id: vin,     role: in,  type: power, polarity: "+", v: { min: 9, max: 18, unit: V } }
  - { id: gnd_in,  role: in,  type: gnd, aliases: [gnd] }
  - { id: vout,    role: out, type: rail, v: { value: 5.0, unit: V }, i: { max: 3, unit: A } }
  - { id: gnd_out, role: out, type: gnd }
asserts:
  - { pin: R2.1, volts: 1.02, tol: 0.05 }   # the FB node: 5 V × 10k/(39k+10k) — the divider's whole job
limits:
  - { field: vin.max, value: 20, unit: V, note: "Cin is rated 25 V; sustained input above ~20 V risks the input cap." }
schematic:
  parts:
    - { ref: U1,   type: ic,       part: buck-controller, footprint: SOIC-8, why: "switches to hold the output at 5 V" }
    - { ref: L1,   type: inductor, value: 10uH, footprint: IND-5040, shielded: false, why: "stores/releases energy each switching cycle" }
    - { ref: Cin,  type: cap,      value: 22uF, footprint: C0805, rating: { volts: 25 }, why: "supplies the switcher's fast current pulses" }
    - { ref: Cout, type: cap,      value: 47uF, footprint: C1206, why: "smooths the output, keeps the loop stable" }
    - { ref: R1,   type: res,      value: 39k,  footprint: R0603, why: "top of feedback divider — sets Vout" }
    - { ref: R2,   type: res,      value: 10k,  footprint: R0603, why: "bottom of feedback divider" }
  nets:
    - { name: VIN,  connect: [U1.VIN, Cin.1, "@vin"] }
    - { name: SW,   connect: [U1.SW, L1.1] }
    - { name: "+5V", connect: [L1.2, Cout.1, R1.1, "@vout"] }
    - { name: FB,   connect: [U1.FB, R1.2, R2.1] }
    - { name: GND,  connect: [U1.GND, Cin.2, Cout.2, R2.2, "@gnd_in", "@gnd_out"] }
layout:
  symbols:
    - { id: P_vin,     type: port,      ref: vin,  x: 40,  y: 100, rot: 180 }
    - { id: Cin,       type: capacitor, ref: Cin,  value: 22µF, x: 118, y: 127, rot: 90 }
    - { id: U1,        type: chip,      ref: U1,   value: buck, x: 240, y: 86, chip: { profile: soic, pins: 4, names: { "1": VIN, "2": GND, "3": SW, "4": FB } } }
    - { id: L1,        type: inductor,  ref: L1,   value: 10µH, x: 380, y: 94 }
    - { id: Cout,      type: capacitor, ref: Cout, value: 47µF, x: 488, y: 127, rot: 90 }
    - { id: R1,        type: resistor,  ref: R1,   value: 39k,  x: 516, y: 140, rot: 90 }
    - { id: R2,        type: resistor,  ref: R2,   value: 10k,  x: 516, y: 248, rot: 90 }
    - { id: P_vout,    type: port,      ref: vout, x: 600, y: 100, rot: 0 }
    - { id: P_gnd_in,  type: port,      ref: gnd_in,  x: 135, y: 229, rot: 90 }
    - { id: P_gnd_out, type: port,      ref: gnd_out, x: 505, y: 309, rot: 90 }
  wires:
    - { from: P_vin.1,    to: Cin.1 }
    - { from: Cin.1,      to: U1.1 }
    - { from: U1.3,       to: L1.1 }
    - { from: L1.2,       to: Cout.1 }
    - { from: Cout.1,     to: P_vout.1 }
    - { from: Cout.1,     to: R1.1 }
    - { from: R1.2,       to: R2.1 }
    - { from: R1.2,       to: U1.4 }
    - { from: Cin.2,      to: P_gnd_in.1 }
    - { from: U1.2,       to: P_gnd_in.1 }
    - { from: P_gnd_in.1, to: P_gnd_out.1 }
    - { from: Cout.2,     to: P_gnd_out.1 }
    - { from: R2.2,       to: P_gnd_out.1 }
