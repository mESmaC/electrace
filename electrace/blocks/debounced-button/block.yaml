id: "@electrace/debounced-button"
name: Debounced Button
version: 1.0.0
category: interface
author: electrace
license: CC-BY-4.0
glyph: "⍾"
spec:
  vcc: { min: 1.8, max: 5.5, unit: V }
  t_debounce: { value: 1, unit: ms }
terminals:
  - { id: vcc, role: in,  type: power, polarity: "+", v: { min: 1.8, max: 5.5, unit: V } }
  - { id: gnd, role: in,  type: gnd }
  - { id: out, role: out, type: signal }
limits:
  - { field: polarity.note, value: 0, note: "OUT idles HIGH and goes LOW when pressed (active-low). Read it with the pin's internal pull-up DISABLED — the external 10k is already doing that job." }
  - { field: timing.note, value: 0, note: "R1×C1 = 10k × 100n ≈ 1 ms — right for tact switches (0.1–1 ms of bounce). A big clicky toggle can bounce for 10 ms+: scale C1 up to 1µF, or debounce the rest in firmware." }
schematic:
  parts:
    - { ref: SW1, type: switch, part: tact, footprint: TACT-6mm, why: "the button — mechanically it doesn't close once, it chatters dozens of times in the first millisecond" }
    - { ref: R1, type: res, value: 10k, footprint: R0603, why: "pull-up — defines the idle-HIGH level and recharges C1 after release" }
    - { ref: C1, type: cap, value: 100n, footprint: C0603, why: "the debouncer — the RC lag glides through the contact chatter so OUT crosses the logic threshold exactly once" }
  nets:
    - { name: VCC, connect: [R1.1, "@vcc"] }
    - { name: OUT, connect: [R1.2, SW1.2, C1.1, "@out"] }
    - { name: GND, connect: [SW1.1, C1.2, "@gnd"] }
layout:
  symbols:
    - { id: P_vcc, type: port,     ref: vcc, x: 40,  y: 40, rot: 180 }
    - { id: R1,    type: resistor, ref: R1, value: 10k, x: 105, y: 81, rot: 90 }
    - { id: SW1,   type: button,   ref: SW1, value: tact, x: 60, y: 118 }
    - { id: C1,    type: capacitor, ref: C1, value: 100n, x: 190, y: 155, rot: 90 }
    - { id: P_out, type: port,     ref: out, x: 320, y: 90, rot: 0 }
    - { id: P_gnd, type: port,     ref: gnd, x: 45, y: 200, rot: 90 }
  wires:
    - { from: P_vcc.1, to: R1.1 }
    - { from: SW1.2,   to: R1.2 }
    - { from: R1.2,    to: C1.1 }
    - { from: C1.1,    to: P_out.1 }
    - { from: SW1.1,   to: P_gnd.1 }
    - { from: C1.2,    to: P_gnd.1 }
