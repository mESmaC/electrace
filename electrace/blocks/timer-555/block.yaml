id: "@electrace/timer-555"
name: 555 Timer (astable)
version: 1.0.0
category: signal
author: electrace
license: CC-BY-4.0
glyph: "∿"
spec:
  vcc: { min: 4.5, max: 15, unit: V }
  f: { value: 1, unit: kHz }
  iout_max: { value: 0.2, unit: A }
terminals:
  - { id: vcc, role: in,  type: power, polarity: "+", v: { min: 4.5, max: 15, unit: V } }
  - { id: gnd, role: in,  type: gnd }
  - { id: out, role: out, type: signal, i: { max: 0.2, unit: A } }
limits:
  - { field: f.formula, value: 0, note: "f ≈ 1.44 / ((Ra + 2·Rb) · C1). The values here (10k + 2×47k, 10nF) give ~1.4 kHz; duty = (Ra+Rb)/(Ra+2Rb) ≈ 55% — duty can never reach 50% exactly in this basic astable (Ra must be > 0)." }
  - { field: c2.note, value: 0, note: "C2 on the CONTROL pin isn't optional decoration — the pin sits at an internal 2/3·VCC divider tap, and supply noise there jitters the threshold. 10 nF quiets it." }
schematic:
  parts:
    - { ref: U1, type: ic, part: ne555, footprint: SOP-8, why: "the timer — two comparators and a latch that bounce C1's voltage between 1/3 and 2/3 of VCC forever" }
    - { ref: Ra, type: res, value: 10k, footprint: R0603, why: "charges C1 (with Rb) toward VCC — sets the HIGH half of the period" }
    - { ref: Rb, type: res, value: 47k, footprint: R0603, why: "C1 discharges through ONLY this into pin 7 — sets the LOW half" }
    - { ref: C1, type: cap, value: 10nF, footprint: C0603, why: "the timing capacitor — its sawtooth between the two trip points IS the oscillation" }
    - { ref: C2, type: cap, value: 10nF, footprint: C0603, why: "quiets the CONTROL pin's internal 2/3·VCC reference" }
  nets:
    - { name: VCC,  connect: [U1.VCC, U1.RST, Ra.1, "@vcc"] }
    - { name: DIS,  connect: [Ra.2, Rb.1, U1.DIS] }
    - { name: TIM,  connect: [Rb.2, C1.1, U1.THR, U1.TRG] }
    - { name: CTRL, connect: [U1.CV, C2.1] }
    - { name: OUT,  connect: [U1.OUT, "@out"] }
    - { name: GND,  connect: [U1.GND, C1.2, C2.2, "@gnd"] }
layout:
  symbols:
    - { id: P_vcc, type: port, ref: vcc, x: 40, y: 40, rot: 180 }
    - { id: Ra,  type: resistor, ref: Ra, value: 10k, x: 95, y: 71, rot: 90 }
    - { id: Rb,  type: resistor, ref: Rb, value: 47k, x: 95, y: 201, rot: 90 }
    - { id: C1,  type: capacitor, ref: C1, value: 10nF, x: 110, y: 335, rot: 90 }
    - { id: U1,  type: chip, ref: U1, value: "555", x: 260, y: 120, chip: { profile: soic, pins: 8, mpn: NE555, names: { "1": GND, "2": TRG, "3": OUT, "4": RST, "5": CV, "6": THR, "7": DIS, "8": VCC } } }
    - { id: C2,  type: capacitor, ref: C2, value: 10nF, x: 400, y: 245, rot: 90 }
    - { id: P_out, type: port, ref: out, x: 470, y: 160, rot: 0 }
    - { id: P_gnd, type: port, ref: gnd, x: 245, y: 420, rot: 90 }
  wires:
    - { from: P_vcc.1, to: Ra.1 }
    - { from: Ra.2,    to: Rb.1 }
    - { from: Ra.2,    to: U1.7, via: [[180, 160]] }
    - { from: Rb.2,    to: C1.1 }
    - { from: Rb.2,    to: U1.6, via: [[200, 290], [200, 180]] }
    - { from: C1.1,    to: U1.2, via: [[220, 320], [220, 140]] }
    - { from: P_vcc.1, to: U1.8, via: [[420, 40], [420, 180]] }
    - { from: U1.4,    to: U1.8, via: [[440, 160], [440, 180]] }
    - { from: U1.5,    to: C2.1 }
    - { from: U1.3,    to: P_out.1 }
    - { from: U1.1,    to: P_gnd.1 }
    - { from: C1.2,    to: P_gnd.1 }
    - { from: C2.2,    to: P_gnd.1, via: [[430, 320], [260, 320]] }
