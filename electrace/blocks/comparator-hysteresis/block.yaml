id: "@electrace/comparator-hysteresis"
name: Comparator (with hysteresis)
version: 1.0.0
category: signal
author: electrace
license: CC-BY-4.0
glyph: "⋛"
spec:
  vcc: { min: 2.7, max: 5.5, unit: V }
  vth: { value: 0.5 }
terminals:
  - { id: vcc, role: in,  type: power, polarity: "+", v: { min: 2.7, max: 5.5, unit: V }, i: { max: 0.003, unit: A } }
  - { id: gnd, role: in,  type: gnd }
  - { id: in,  role: in,  type: signal }
  - { id: out, role: out, type: signal, v: { follows: vcc } }
limits:
  - { field: hysteresis.note, value: 0, note: "R3/Rin set the hysteresis: width ≈ VCC · Rin/(Rin+R3) ≈ 1% of VCC here (50 mV at 5 V). Too little and a slow or noisy input chatters the output at the threshold; widen it by shrinking R3." }
  - { field: pullup.note, value: 0, note: "Comparator outputs (LM393-class) are OPEN-COLLECTOR — they can only pull LOW. Without R4 the output never goes high and 'the comparator is broken'. It isn't; it's missing its pull-up." }
schematic:
  parts:
    - { ref: U1,  type: ic,  part: comparator, footprint: SOT-23-5, why: "the comparator — output snaps low when in− exceeds in+, releases when it drops back" }
    - { ref: R1,  type: res, value: 100k, footprint: R0603, why: "top of the reference divider — with R2, parks the threshold at VCC/2" }
    - { ref: R2,  type: res, value: 100k, footprint: R0603, why: "bottom of the reference divider" }
    - { ref: Rin, type: res, value: 10k,  footprint: R0603, why: "input series resistance — gives the feedback something to push against (no Rin, no hysteresis)" }
    - { ref: R3,  type: res, value: 1M,   footprint: R0603, why: "the hysteresis feedback — nudges in+ a little in the output's favour, so the trip point moves AWAY from a signal that just crossed it" }
    - { ref: R4,  type: res, value: 10k,  footprint: R0603, why: "output pull-up — the open-collector output can only pull low; this makes the HIGH" }
  nets:
    - { name: VCC, connect: [U1.vcc, R1.1, R4.1, "@vcc"] }
    - { name: REF, connect: [R1.2, R2.1, U1.in-] }
    - { name: IN,  connect: [Rin.1, "@in"] }
    - { name: INP, connect: [Rin.2, U1.in+, R3.1] }
    - { name: OUT, connect: [U1.out, R4.2, R3.2, "@out"] }
    - { name: GND, connect: [U1.gnd, R2.2, "@gnd"] }
layout:
  symbols:
    - { id: P_vcc, type: port, ref: vcc, x: 40, y: 30, rot: 180 }
    - { id: R1, type: resistor, ref: R1, value: 100k, x: 65, y: 71, rot: 90 }
    - { id: R2, type: resistor, ref: R2, value: 100k, x: 65, y: 201, rot: 90 }
    - { id: P_in, type: port, ref: in, x: 20, y: 100, rot: 180 }
    - { id: Rin, type: resistor, ref: Rin, value: 10k, x: 90, y: 96 }
    - { id: R3, type: resistor, ref: R3, value: 1M, x: 190, y: 30 }
    - { id: U1, type: chip, ref: U1, value: cmp, x: 260, y: 120, chip: { profile: sot23, pins: 5, mpn: LM393, names: { "1": "in+", "2": "in-", "3": "gnd", "5": "vcc", "4": "out" } } }
    - { id: R4, type: resistor, ref: R4, value: 10k, x: 375, y: 101, rot: 90 }
    - { id: P_out, type: port, ref: out, x: 470, y: 150, rot: 0 }
    - { id: P_gnd, type: port, ref: gnd, x: 185, y: 300, rot: 90 }
  wires:
    - { from: P_vcc.1, to: R1.1 }
    - { from: R1.2, to: R2.1 }
    - { from: R1.2, to: U1.2, via: [[240, 130], [240, 160]] }
    - { from: P_in.1, to: Rin.1 }
    - { from: Rin.2, to: U1.1 }
    - { from: R3.1, to: Rin.2, via: [[180, 44]] }
    - { from: R3.2, to: U1.4, via: [[350, 44], [350, 160]] }
    - { from: P_vcc.1, to: U1.5 }
    - { from: R4.1, to: U1.5 }
    - { from: U1.4, to: R4.2 }
    - { from: R4.2, to: P_out.1 }
    - { from: R2.2, to: P_gnd.1 }
    - { from: U1.3, to: P_gnd.1 }
